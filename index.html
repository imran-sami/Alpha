<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ALPHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1fb;--bg2:#e6e2f7;--card:rgba(255,255,255,.75);--bd:rgba(90,70,200,.15);--tx:#1a1533;--mu:#6b6790;--a:#6d4aff;--b:#00b8d9;--glow:rgba(109,74,255,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0818;--bg2:#17113a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f2f0ff;--mu:#9d98c8;--a:#8b6bff;--b:#22d3ee;--glow:rgba(139,107,255,.35)}}
:root[data-theme="dark"]{--bg:#0a0818;--bg2:#17113a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f2f0ff;--mu:#9d98c8;--a:#8b6bff;--b:#22d3ee;--glow:rgba(139,107,255,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 10% -10%,var(--bg2),transparent),radial-gradient(700px 500px at 100% 100%,var(--bg2),transparent),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);backdrop-filter:blur(20px);border-top:1px solid var(--bd);z-index:5}
nav button{background:none;border:0;color:var(--mu);font:600 11px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:14px;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--tx);background:linear-gradient(135deg,var(--glow),transparent)}
.logo{display:none;font:800 26px inherit;letter-spacing:6px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px}
main{flex:1;padding:18px 16px 100px;max-width:1100px;margin:0 auto;width:100%}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;width:200px;flex-direction:column;justify-content:flex-start;gap:6px;padding:28px 14px;border-top:0;border-right:1px solid var(--bd)}nav button{flex-direction:row;font-size:14px;gap:12px;width:100%}.logo{display:block}main{padding:28px 32px}}
h1{font-size:22px;margin-bottom:4px}.sub{color:var(--mu);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;backdrop-filter:blur(16px);box-shadow:0 10px 40px -20px var(--glow)}
.card h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.big{font:800 30px inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font:600 13px inherit}
.chip.on{color:#fff;border-color:transparent}
input[type=text],input[type=password]{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
.btn{border:0;cursor:pointer;color:#fff;font:700 15px inherit;padding:14px 22px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px -8px var(--glow);transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.stop{background:linear-gradient(135deg,#ff4d6d,#ff8a4c)}.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.35}}
.hm{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}.hm div{aspect-ratio:1;border-radius:4px;background:var(--a)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.mu{color:var(--mu);font-size:13px}.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{padding:8px 12px;font-size:13px;border-radius:12px}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .card{width:100%;max-width:340px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
#modal>div{max-width:92vw;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px;padding:14px}
#modal img,#modal video,#modal iframe{max-width:100%;max-height:70vh;border-radius:12px}
.t{overflow-x:auto}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 18s ease-in-out infinite alternate;pointer-events:none}
body::before{background:var(--a);top:-20vmax;left:-15vmax}body::after{background:var(--b);bottom:-25vmax;right:-15vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main>*{animation:up .5s both}main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 50px -18px var(--glow)}
.btn{position:relative;overflow:hidden;transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}.btn:hover::after{transform:translateX(120%)}
.chip{transition:.2s}.chip:hover{border-color:var(--a);transform:translateY(-1px)}
nav button{transition:.2s}nav button:hover{color:var(--tx);background:var(--card)}
.logo{text-shadow:0 0 30px var(--glow)}
.fab{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:6}
.fab button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);color:var(--tx);font-size:17px;cursor:pointer;transition:.2s}.fab button:hover{border-color:var(--a);transform:rotate(15deg)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:60}#toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}
@media(min-width:800px){#toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f6f0ff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ALPHA"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>try{if(!localStorage.getItem("alpha.mig1")){localStorage.setItem("alpha.ti","9");localStorage.setItem("alpha.mig1","1")}}catch(e){}</script><script>try{if(!localStorage.getItem("alpha.chk"))document.documentElement.classList.add("first")}catch(e){}</script><style>html.first #lock{--bg:#0a0818;--bg2:#17113a;--a:#8b6bff;--b:#22d3ee;--glow:#8b6bff55;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f2f0ff;--mu:#9d98c8;color-scheme:dark}html.first #lock{background:radial-gradient(700px 420px at 15% -5%,#17113a,transparent),radial-gradient(600px 420px at 100% 100%,#17113a,transparent),#0a0818}</style></head><body>
<div id="lock"><div class="card"><div class="logo" style="display:block;margin-bottom:6px">ALPHA</div><p class="mu" id="lm" style="margin-bottom:16px"></p><input type="password" id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off"><input type="password" id="pin2" inputmode="numeric" placeholder="Confirm PIN" autocomplete="off" style="margin-top:10px;display:none"><p class="mu" id="le" style="color:#ff4d6d;margin:8px 0"></p><button class="btn" style="width:100%" id="lb"></button><p class="mu" style="margin-top:14px"><a id="rs" href="#" style="color:var(--mu)">Forgot PIN? Reset ALPHA</a></p></div></div>
<div id="app"><nav><div class="logo">ALPHA</div>
<button data-v="dash" class="on"><i>◉</i>Home</button><button data-v="ins"><i>◔</i>Insights</button><button data-v="vault"><i>◈</i>Vault</button><button data-v="hist"><i>≡</i>History</button></nav>
<main id="main"></main></div>
<div class="fab"><button id="th" title="Settings" style="overflow:hidden;padding:0">👤</button><button id="lk" title="Lock now">🔒</button></div><div id="toast"></div><div id="modal"><div id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),C={Work:'#7c5cff',Fitness:'#ff4d8d',Study:'#22d3ee',Leisure:'#fbbf24',Sleep:'#34d399'};let GOAL=360;
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let acts=ls.g('alpha.acts',null),run=ls.g('alpha.run',null),cat='Work',view='dash',key=null,idle;
if(!acts){acts=[];const n=Date.now();for(let d=1;d<8;d++)for(let i=0;i<4;i++){const c=Object.keys(C)[Math.floor(Math.random()*5)],h=[7,9,13,17,21][i]+Math.random(),st=new Date(n-d*864e5).setHours(0,0,0,0)+h*36e5;acts.push({id:st,cat:c,name:c+' session',s:st,e:st+(25+Math.random()*80)*6e4})}ls.s('alpha.acts',acts)}
const dk=t=>new Date(t).toDateString(),mins=a=>((a.e||Date.now())-a.s)/6e4,all=()=>run?acts.concat([{cat:run.cat,name:run.name,s:run.s,e:Date.now()}]):acts;
const fm=m=>m>=60?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.round(m)+'m',esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>all().filter(a=>dk(a.s)==dk(Date.now()));
function days(n){const r=[];for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*864e5);r.push({l:d.toLocaleDateString([], {weekday:'short'}),m:all().filter(a=>dk(a.s)==d.toDateString()).reduce((x,a)=>x+mins(a),0)})}return r}
function streak(){let s=0;for(let i=0;i<30;i++){if(all().some(a=>dk(a.s)==new Date(Date.now()-i*864e5).toDateString()))s++;else if(i>0)break;else continue}return s}
// charts
function ring(p){const r=54,c=2*Math.PI*r,v=Math.min(1,p);return `<svg viewBox="0 0 140 140" width="150"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b6bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" fill="var(--tx)" font-size="26" font-weight="800">${Math.round(p*100)}%</text></svg>`}
function bars(d,h=130){const mx=Math.max(1,...d.map(x=>x.m)),w=100/d.length;return `<svg viewBox="0 0 100 ${h/2+12}" width="100%" preserveAspectRatio="none" style="height:${h+24}px"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b6bff"/></linearGradient></defs>${d.map((x,i)=>{const bh=x.m/mx*(h/2);return `<rect x="${i*w+w*.18}" y="${h/2-bh}" width="${w*.64}" height="${bh}" rx="1.5" fill="url(#b)"/><text x="${i*w+w/2}" y="${h/2+9}" text-anchor="middle" font-size="4" fill="var(--mu)">${x.l}</text>`}).join('')}</svg>`}
function donut(data){const t=data.reduce((x,d)=>x+d.m,0)||1,r=42,c=2*Math.PI*r;let o=0;return `<svg viewBox="0 0 120 120" width="170"><g transform="rotate(-90 60 60)">${data.map(d=>{const l=d.m/t*c,e=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${C[d.k]}" stroke-width="16" stroke-dasharray="${Math.max(0,l-1)} ${c}" stroke-dashoffset="${-o}"/>`;o+=l;return e}).join('')}</g><text x="60" y="66" text-anchor="middle" fill="var(--tx)" font-size="16" font-weight="800">${fm(t)}</text></svg>`}
function hourly(){const h=Array(24).fill(0);all().forEach(a=>{if(dk(a.s)==dk(Date.now()))h[new Date(a.s).getHours()]+=mins(a)});return bars(h.map((m,i)=>({m,l:i%3?'':i})),110)}
function heat(){const h=Array(24).fill(0);all().forEach(a=>h[new Date(a.s).getHours()]+=mins(a));const mx=Math.max(1,...h);return {html:`<div class="hm">${h.map((v,i)=>`<div title="${i}:00 · ${fm(v)}" style="opacity:${.08+.92*v/mx}"></div>`).join('')}</div><div class="row sp mu" style="margin-top:6px"><span>12am</span><span>12pm</span><span>11pm</span></div>`,best:h.indexOf(mx)}}
function bycat(n){const m={};all().filter(a=>Date.now()-a.s<n*864e5).forEach(a=>m[a.cat]=(m[a.cat]||0)+mins(a));return Object.keys(C).map(k=>({k,m:m[k]||0}))}
// views
function stats(){const t=today(),m=t.reduce((x,a)=>x+mins(a),0),f=t.filter(a=>a.cat!='Sleep').reduce((x,a)=>x+mins(a),0);
$('#st')&&($('#st').innerHTML=`<div class="card"><h3>Today</h3><div class="big">${fm(m)}</div><div class="mu">${t.length} sessions</div></div><div class="card"><h3>Streak</h3><div class="big">🔥 ${streak()}</div><div class="mu">days active</div></div><div class="card"><h3>Focus goal</h3><div class="row"><div>${ring(f/GOAL)}</div><div class="mu">${fm(f)} of ${fm(GOAL)}<br><button class="chip sm" id="eg" style="margin-top:8px">✎ Edit goal</button></div></div></div>`);
$('#hr')&&($('#hr').innerHTML=hourly());
if($('#tm')){const e=run?Math.floor((Date.now()-run.s)/1e3):0;$('#tm').textContent=[Math.floor(e/3600),Math.floor(e/60)%60,e%60].map(x=>String(x).padStart(2,'0')).join(':')}}
function chipsH(){return `<div class="chips">${Object.keys(C).map(k=>`<button class="chip ${k==cat?'on':''}" style="${k==cat?'background:'+C[k]:''}" data-c="${k}">${k}</button>`).join('')}</div>`}
function dash(){const hr=new Date().getHours();$('#main').innerHTML=`<h1>Good ${hr<12?'morning':hr<18?'afternoon':'evening'}, ${esc(pname)}</h1><p class="sub">Your day, live.</p>
<div class="card" style="margin-bottom:14px"><h3>${run?'<span class="pulse">●</span> Tracking · '+run.cat:'Start an activity'}</h3><div class="big" id="tm" style="font-size:44px;font-variant-numeric:tabular-nums">00:00:00</div>
${run?`<div class="mu" style="margin:6px 0 12px">${esc(run.name)}</div><button class="btn stop" id="go">■ Stop</button>`:`${chipsH()}<div class="row"><input type="text" id="nm" placeholder="What are you doing?"><button class="btn" id="go">▶ Start</button></div>`}</div>
<div class="grid" id="st" style="margin-bottom:14px"></div><div class="card"><h3>Today by hour · live</h3><div id="hr"></div></div>`;
$('#go').onclick=()=>{if(run){acts.push({id:Date.now(),cat:run.cat,name:run.name,s:run.s,e:Date.now()});run=null;ls.s('alpha.acts',acts)}else run={cat,name:$('#nm').value.trim()||cat+' session',s:Date.now()};ls.s('alpha.run',run);toast(run?'Tracking started':'Session saved');dash()};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;dash()});stats()}
function ins(){const w=bycat(7),t=w.reduce((x,d)=>x+d.m,0)||1,top=[...w].sort((a,b)=>b.m-a.m)[0],h=heat(),d7=days(7),avg=d7.reduce((x,d)=>x+d.m,0)/7;
$('#main').innerHTML=`<h1>Insights</h1><p class="sub">Deep dive · last 7 days</p><div class="grid">
<div class="card"><h3>Time split</h3><div class="row" style="flex-wrap:wrap;justify-content:center">${donut(w)}<div>${w.map(d=>`<div class="row mu" style="margin:5px 0"><span class="dot" style="background:${C[d.k]}"></span>${d.k} · ${Math.round(d.m/t*100)}% · ${fm(d.m)}</div>`).join('')}</div></div></div>
<div class="card"><h3>Daily minutes</h3>${bars(d7)}</div>
<div class="card"><h3>Peak hours</h3>${h.html}</div>
<div class="card"><h3>AI-style read-out</h3><p>Most of your time goes to <b style="color:${C[top.k]}">${top.k}</b> (${Math.round(top.m/t*100)}%). You're most active around <b>${h.best}:00</b>, averaging <b>${fm(avg)}</b> per day. ${avg>=GOAL?'You are hitting your goal consistently — keep the rhythm.':'Try a block at '+h.best+':00 to push toward your '+fm(GOAL)+' goal.'}</p></div></div>`}
function hist(){const l=[...acts].reverse().slice(0,60);$('#main').innerHTML=`<h1>History</h1><p class="sub">${acts.length} sessions</p><div class="card">${l.map(a=>`<div class="item"><span class="dot" style="background:${C[a.cat]}"></span><div class="grow">${esc(a.name)}<div class="mu">${new Date(a.s).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</div></div><b>${fm(mins(a))}</b><button class="chip sm" data-d="${a.id}">✕</button></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div><div class="row" style="margin-top:14px"><button class="btn ghost sm" id="cl">Clear all data</button></div>`;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{acts=acts.filter(a=>a.id!=b.dataset.d);ls.s('alpha.acts',acts);hist()});$('#cl').onclick=()=>ask('Delete all activity data?',()=>{acts=[];ls.s('alpha.acts',acts);hist()})}
// crypto + vault
const enc=new TextEncoder(),cat2=(a,b)=>{const r=new Uint8Array(a.length+b.byteLength);r.set(a);r.set(new Uint8Array(b),a.length);return r};
async function mk(pin,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function en(buf){const iv=crypto.getRandomValues(new Uint8Array(12));return cat2(iv,await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf)).buffer}
async function de(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12))}
const b64=u=>btoa(String.fromCharCode(...u)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let db;const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('alpha',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=(m,f)=>new Promise((r,j)=>{const q=f(db.transaction('f',m).objectStore('f'));q.onsuccess=()=>r(q.result);q.onerror=j});
const sz=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB',icon=t=>t.startsWith('image')?'🖼':t.startsWith('video')?'🎬':t.startsWith('audio')?'🎵':t.includes('pdf')?'📕':t.startsWith('text')?'📝':'📦';
async function vault(){let fl=[];try{db=db||await idb();fl=await tx('readonly',s=>s.getAll())}catch(e){}
$('#main').innerHTML=`<h1>Vault</h1><p class="sub">🔒 AES-256 encrypted with your PIN · stored only on this device</p><label class="btn" style="display:inline-block;margin-bottom:14px">＋ Add files<input type="file" id="fi" multiple hidden></label><div class="card">${fl.map(f=>`<div class="item"><span style="font-size:24px">${icon(f.type)}</span><div class="grow">${esc(f.name)}<div class="mu">${sz(f.size)}</div></div><button class="chip sm" data-o="${f.id}">Open</button><button class="chip sm" data-x="${f.id}">✕</button></div>`).join('')||'<p class="mu">Your vault is empty. Any file type works.</p>'}</div>`;
$('#fi').onchange=async e=>{for(const f of e.target.files){if(f.size>60e6&&!confirm(f.name+' is large. Continue?'))continue;await tx('readwrite',s=>s.put({id:Date.now()+Math.random(),name:f.name,type:f.type||'file',size:f.size,d:null,blob:null}));}
 const rows=await tx('readonly',s=>s.getAll());for(const r of rows)await tx('readwrite',s=>s.delete(r.id));
